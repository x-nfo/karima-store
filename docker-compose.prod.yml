version: '3.8'

services:
  # ==========================================
  # CLOUDFLARE TUNNEL (Ingress)
  # ==========================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: karima_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_started
      kratos:
        condition: service_started

  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: karima_store_backend:v1.0.7
    container_name: karima_store_backend
    restart: always
    # env_file:
    #   - .env.production
    environment:
      # Load from Portainer Environment variables
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-5432}
      
      # App Config
      - APP_ENV=production
      - APP_PORT=8080
      
      # Auth / Kratos
      - KRATOS_PUBLIC_URL=${KRATOS_PUBLIC_URL}
      - KRATOS_ADMIN_URL=${KRATOS_ADMIN_URL}
      - JWT_SECRET=${JWT_SECRET}

      # Email / SMTP
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}

      # 3rd Party
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - RAJAONGKIR_API_KEY=${RAJAONGKIR_API_KEY}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kratos:
        condition: service_started
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # ORY KRATOS (Authentication)
  # ==========================================
  kratos-migrate:
    build:
      context: ./deploy/kratos
      dockerfile: Dockerfile
    image: karima_store_kratos:latest
    container_name: kratos_migrate
    environment:
      - DSN=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME}?sslmode=disable&max_conns=20&max_idle_conns=4
    # volumes:
    #   - ./deploy/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.prod.yml migrate sql -e --yes
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

  kratos:
    build:
      context: ./deploy/kratos
      dockerfile: Dockerfile
    image: karima_store_kratos:v1.0.7
    container_name: kratos
    restart: always
    environment:
      - DSN=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME}?sslmode=disable&max_conns=20&max_idle_conns=4
      # Kratos Config Overrides via Env Vars
      - SERVE_PUBLIC_BASE_URL=${KRATOS_PUBLIC_URL}
      - SERVE_ADMIN_BASE_URL=${KRATOS_ADMIN_URL}
      - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL=${KRATOS_UI_URL}/
      - SELFSERVICE_ALLOWED_RETURN_URLS=${KRATOS_UI_URL}/,https://karimasyari.com/,https://www.karimasyari.com/,https://admin.karimasyari.com/
      - SECRETS_COOKIE=${SESSION_SECRET}
      - SECRETS_CIPHER=${ENCRYPTION_KEY}
      - COURIER_SMTP_CONNECTION_URI=smtps://${EMAIL_USER}:${EMAIL_PASSWORD}@${EMAIL_HOST}:${EMAIL_PORT}/?skip_ssl_verify=false
      
      # UI URL Overrides - Fixes 404 on redirect
      - SELFSERVICE_FLOWS_LOGIN_UI_URL=${KRATOS_UI_URL}/login
      - SELFSERVICE_FLOWS_REGISTRATION_UI_URL=${KRATOS_UI_URL}/registration
      - SELFSERVICE_FLOWS_RECOVERY_UI_URL=${KRATOS_UI_URL}/recovery
      - SELFSERVICE_FLOWS_VERIFICATION_UI_URL=${KRATOS_UI_URL}/verification
      - SELFSERVICE_FLOWS_SETTINGS_UI_URL=${KRATOS_UI_URL}/settings
      - SELFSERVICE_FLOWS_ERROR_UI_URL=${KRATOS_UI_URL}/error

      # CORS and Session config is handled in deploy/kratos/kratos.prod.yml
    # volumes:
    #   - ./deploy/kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.prod.yml --watch-courier
    # Ports NOT exposed publicly - accessed via Tunnel
    expose:
      - "4433" # Public API
      - "4434" # Admin API
    networks:
      - app_network
    # depends_on:
    #   kratos-migrate:
    #     condition: service_completed_successfully
    depends_on:
      # kratos-migrate:
      #   condition: service_completed_successfully
      db:
        condition: service_healthy

  # ==========================================
  # DATABASE (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: karima_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS (Cache)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: karima_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MONITORING STACK
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: always
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: karima-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  prometheus_data:
  grafana_data:
